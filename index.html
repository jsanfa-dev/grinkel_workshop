<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grinkel Workshop</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        #magical-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('path/to/your/magical-background-image.jpg') no-repeat center center / cover;
            z-index: 1;
            transition: opacity 1s;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            opacity: 0;
            z-index: 2;
            transition: opacity 1s;
        }
        #message {
            position: relative;
            color: white;
            font-size: 2em;
            z-index: 3;
            display: none;
            animation: fade-in 1s forwards;
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="magical-background"></div>
    <div id="overlay"></div>
    <div id="message">Your message here. This will disappear after 8 seconds.</div>
    <script>
        // Show the overlay and message
        document.getElementById('overlay').style.opacity = 1;
        document.getElementById('message').style.display = 'block';
        setTimeout(function() {
            document.getElementById('overlay').style.opacity = 0;
            document.getElementById('message').style.display = 'none';
        }, 8000); // message disappears after 8 seconds
    </script>
</body>
</html>
